org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# Keep the app installed after connectedAndroidTest: the default uninstall wiped the
# real install's sessions and settings (debug build is the daily-use app).
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Shared by :app and :wear. The version code is derived from this name in the root
# build.gradle.kts (X.Y.Z -> X*10000 + Y*100 + Z; the watch adds 1_000_000).
pm.versionName=1.1.0
